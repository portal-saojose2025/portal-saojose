<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portal São José do Gorutuba</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Portal São José do Gorutuba</h1>
    <nav>
      <button onclick="alert('Em breve: História')">História</button>
      <button onclick="alert('Em breve: Fotos')">Fotos</button>
      <button onclick="alert('Em breve: Contato')">Contato</button>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h2>Bem-vindo ao Portal</h2>
      <p>Aqui você vai conhecer a fé, a cultura e a história de São José do Gorutuba.</p>
    </section>

    <section class="galeria">
      <h2>Galeria de Fotos</h2>
      <div class="fotos">
        <img src="https://via.placeholder.com/300x200.png?text=Foto+1" alt="Foto 1">
        <img src="https://via.placeholder.com/300x200.png?text=Foto+2" alt="Foto 2">
        <img src="https://via.placeholder.com/300x200.png?text=Foto+3" alt="Foto 3">
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Portal São José do Gorutuba</p>
  </footer>
</body>
</html>
